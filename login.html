<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* 1. Thiết lập chung cho toàn bộ trang */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #08080a; /* Nền tối hẳn sâu hơn để nổi bật màu đỏ */
            overflow: hidden;
        }

        /* 2. Khung Đăng Nhập (Login Card) */
        .login-card {
            position: relative;
            width: 380px;
            padding: 30px;
            background: #111116; /* Màu nền của form xám đen */
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 0, 0.08); /* Viền đỏ siêu nhẹ */
            text-align: center;
            /* Tạo hiệu ứng đổ bóng phát sáng màu Đỏ */
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.25);
            transition: 0.3s;
        }

        /* 3. Phần hình ảnh phía trên */
        .banner-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 0, 0, 0.15);
            /* Đổ bóng đỏ cho riêng bức ảnh */
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
        }

        /* 4. Tiêu đề chính */
        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #ff3333; /* Đã đổi sang Đỏ Neon */
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* 5. Ô nhập liệu (Input Fields) */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

            .input-group input {
                width: 100%;
                padding: 14px 20px;
                background: #171721;
                border: 1px solid #2a2a38;
                border-radius: 8px;
                color: #ffffff;
                font-size: 15px;
                outline: none;
                transition: 0.3s;
            }

                /* Hiệu ứng khi nhấn vào ô nhập - Đổi sang viền Đỏ */
                .input-group input:focus {
                    border-color: #ff3333;
                    box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
                }

                /* Thay đổi màu chữ gợi ý (Placeholder) */
                .input-group input::placeholder {
                    color: #4e4e5e;
                }

        /* 6. Nút Đăng Nhập (Login Button) */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #b30000, #ff3333); /* Gradient Đỏ đậm sang Đỏ tươi */
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            margin-bottom: 20px;
        }

            .btn-login:hover {
                opacity: 0.95;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
            }

        /* 7. Dòng chữ nhỏ dưới cùng */
        .footer-text {
            font-size: 12px;
            color: #666677;
        }

            .footer-text a {
                color: #ff3333; /* Đổi link sang Đỏ */
                text-decoration: none;
            }

                .footer-text a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div class="login-card">
        <img class="banner-img" src="https://i.pinimg.com/736x/43/5b/32/435b329eee1e93ba39c347e9d2f49d56.jpg" alt="Banner">

        <div class="title">Nglew</div>
        <div class="subtitle">Secure Login</div>

        <form>
            <div class="input-group">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="footer-text">
            Đăng nhập tài khoản <a href="#">@nglew._</a>
        </div>
        <script>
            // Lấy thẻ form đăng nhập
            const loginForm = document.querySelector('form');

            // Lắng nghe sự kiện khi người dùng nhấn nút Đăng Nhập (Submit Form)
            loginForm.addEventListener('submit', function (event) {
                event.preventDefault(); // Ngăn trang bị tải lại theo mặc định

                // Ở đây bạn có thể thêm logic kiểm tra tài khoản nếu muốn,
                // Còn hiện tại, cứ bấm Login là sẽ chuyển hướng:

                // Chuyển hướng người dùng sang trang web phim của bạn
                window.location.href = "animeweb.html";
            });
        </script>
    </div>

</body>
</html>
